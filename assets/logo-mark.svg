<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Jarvis</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#0d1a11" />
      <stop offset="1" stop-color="#030504" />
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#eaffef" />
      <stop offset="0.45" stop-color="#7dffa0" />
      <stop offset="1" stop-color="#39ff6a" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#1d3324" stroke-width="4" />

  <g transform="translate(0 -14)" fill="none" stroke="#39ff6a" stroke-linecap="round" stroke-linejoin="round">
    <!-- Frame: two round lenses, bridge and short temples. -->
    <g stroke-width="14" filter="url(#soft)">
      <circle cx="160" cy="268" r="96" />
      <circle cx="352" cy="268" r="96" />
      <path d="M232 205 Q256 186 280 205" />
      <path d="M64 252 L44 214" />
      <path d="M448 252 L468 214" />
    </g>

    <!-- Left lens: the arc reactor, a segmented ring around a bright core. -->
    <g filter="url(#glow)">
      <circle cx="160" cy="268" r="62" stroke-width="15" stroke-dasharray="22 16.96" transform="rotate(-90 160 268)" />
      <circle cx="160" cy="268" r="38" stroke-width="3" opacity="0.6" />
    </g>
    <circle cx="160" cy="268" r="34" fill="url(#core)" stroke="none" />

    <!-- Right lens: a HUD readout, corner brackets and text lines. -->
    <g stroke-width="7" opacity="0.95">
      <path d="M302 222 v-14 h18 M402 222 v-14 h-18 M302 314 v14 h18 M402 314 v14 h-18" />
    </g>
    <g stroke-width="9" filter="url(#soft)">
      <path d="M318 242 h56" />
      <path d="M318 268 h68" />
      <path d="M318 294 h40" />
    </g>
  </g>
</svg>
