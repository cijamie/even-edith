<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Even Jarvis</title>
  </head>
  <body>
    <main id="phone">
      <header class="masthead">
        <h1>EVEN JARVIS</h1>
        <p id="status" class="status">Connecting to glasses…</p>
      </header>

      <section class="card" aria-labelledby="keys-title">
        <h2 id="keys-title">API keys</h2>
        <p class="hint">
          Your keys stay on this phone and are sent only to Google and Groq.
          Both have free tiers.
        </p>
        <div id="keys"></div>
      </section>

      <section class="card" aria-labelledby="diag-title">
        <h2 id="diag-title">Connection test</h2>
        <p class="hint">
          Checks each service from this exact app. Run it inside the Even app on your
          phone: that's the environment that counts.
        </p>
        <div id="diagnostics"></div>
      </section>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
